# Default configuration for Spring Data Redis workload runner
runner:
  redis:
    clientName: "lettuce-test-app"
    host: localhost
    port: 6379
    database: 0
    useTls: false
    timeout: PT0.200S  # 200ms

  pool:
    maxActive: 8
    maxIdle: 8
    minIdle: 0

  test:
    mode: standalone
    concurrentWorkers: 1
    workload:
      type: get_set  # Available types: get_set, redis_commands
      maxDuration: PT60S
      options:
        getSetRatio: 0.5
        valueSize: 100
        iterationCount: 100
        elementsCount: 1
        keyGenerationStrategy: RANDOM
        keyPattern: "key-%d"
        keyRangeMin: 0
        keyRangeMax: 1000