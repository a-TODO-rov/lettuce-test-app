runner:
  redis:
    clientName: "lettuce-test-app"
    host: localhost
    port: 6379
    database: 0
    useTls: false
    #username: "default"
    #password: "password"
    timeout: PT0.200S  # 200ms

  pool:
    maxActive: 8
    maxIdle: 8
    minIdle: 1

  test:
    mode: standalone  # standalone or cluster
    concurrentWorkers: 1  # Number of concurrent worker threads
    workload:
      type: get_set  # Available workload types: get_set, redis_commands
      maxDuration: PT10S  # Max duration per workload (10 seconds for testing)
      options:
        getSetRatio: 0.5      # Ratio of SET operations (0.5 = 50% GET, 50% SET)
        valueSize: 100        # Value size in characters
        iterationCount: 100   # How many iterations per workload run
        elementsCount: 1      # Number of elements for list operations
        keyGenerationStrategy: RANDOM  # RANDOM or SEQUENTIAL
        keyPattern: "key-%d"  # Key pattern
        keyRangeMin: 0
        keyRangeMax: 1000